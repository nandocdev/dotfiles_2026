# Font configuration
font_family      JetBrainsMono Nerd Font
font_size        10.0
bold_font        auto
italic_font      auto
bold_italic_font auto
disable_ligatures cursor

# Cursor configuration
# cursor                  #83a598
# cursor_text_color       #1d2021
cursor_shape            block
cursor_beam_thickness   1.3
cursor_blink_interval   0.5
cursor_stop_blinking_after 15.0

# Scrollback
scrollback_lines        5000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier 3.0

# URL handling
# url_color               #0087bd
url_style               curly
open_url_with           default
detect_urls             yes
copy_on_select          yes
strip_trailing_spaces   smart
focus_follows_mouse     yes
confirm_os_window_close 0

# Performance
repaint_delay           5
input_delay             2
sync_to_monitor         yes

# Window settings
remember_window_size    yes
initial_window_width    800
initial_window_height   500
window_border_width     0.5pt
window_margin_width     2
window_padding_width    2
hide_window_decorations no
background_opacity      0.9

# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
tab_title_template      "{index}: {title}"
# active_tab_foreground   #111
# active_tab_background   #eee
# inactive_tab_foreground #666
# inactive_tab_background #888

# Layouts
enabled_layouts splits,stack
kitty_mod ctrl+shift

# ===== Navegación básica =====
map kitty_mod+enter new_window
map kitty_mod+w close_window
map kitty_mod+] next_window
map kitty_mod+[ previous_window

# ===== Splits =====
map kitty_mod+h launch --location=hsplit --cwd=current
map kitty_mod+b launch --location=vsplit --cwd=current
map kitty_mod+r layout_action rotate

# ===== Navegación entre splits =====
map kitty_mod+left neighboring_window left
map kitty_mod+down neighboring_window down
map kitty_mod+up neighboring_window up
map kitty_mod+right neighboring_window right

# ===== Redimensionar splits =====
map kitty_mod+ctrl+left resize_window narrower
map kitty_mod+ctrl+right resize_window wider
map kitty_mod+ctrl+up resize_window taller
map kitty_mod+ctrl+down resize_window shorter

# ===== Pestañas =====
map kitty_mod+t new_tab
map kitty_mod+q close_tab
map kitty_mod+right next_tab
map kitty_mod+left previous_tab

# ===== Tamaño de fuente =====
map kitty_mod+plus  change_font_size all +1.0
map kitty_mod+minus change_font_size all -1.0
map kitty_mod+0     change_font_size all 0

# ===== Búsqueda y Hints =====
map kitty_mod+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse --exact -i
map kitty_mod+e kitten hints
map kitty_mod+p kitten hints --type path --program -
map kitty_mod+g kitten hints --type hash --program -

# ===== Clipboard y utilidades =====
map kitty_mod+c copy_to_clipboard
map ctrl+l send_text all \x0c
map kitty_mod+f10 toggle_fullscreen
map kitty_mod+m minimize

# ===== Sesiones =====
map kitty_mod+s save_window_layout
map kitty_mod+S load_window_layout

# ===== Shell y control =====
shell_integration enabled
allow_remote_control yes
listen_on unix:/tmp/kitty
clipboard_control write-clipboard write-primary read-clipboard read-primary

# ===== Colores y selección =====
# selection_foreground #1d2021
# selection_background #83a598
# mark1_background #b8bb26

# ===== Platform specific =====
# macOS (descomenta si usas macOS)
# macos_option_as_alt yes
# macos_hide_titlebar yes
# macos_window_resizable yes

# Linux (descomenta si usas Wayland)
# linux_display_server auto

# ===== Tema =====
# BEGIN_KITTY_THEME
# Gruvbox Material Dark Soft
include current-theme.conf
# END_KITTY_THEME
#

# ===== Ayuda de atajos =====
map kitty_mod+? launch --type=overlay /bin/bash -c "~/.local/bin/kitty-config-help || echo 'Script no encontrado. Ejecuta: ~/.local/bin/kitty-config-help'"
map kitty_mod+F1 launch --type=overlay /bin/bash -c "~/.local/bin/kitty-config-help"
